name: Publication quotidienne réseaux sociaux

on:
  schedule:
    # 08h00 UTC = 09h00 (hiver) ou 10h00 (été) heure de Paris
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bathily-buffer-social-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post-to-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      # Live Buffer publication is intentionally disabled.
      # Re-enabling requires a separately approved production gate.
      - name: Publier le post du jour sur Buffer
        run: node scripts/post-to-buffer.js --dry-run
